name: Fluxa domain checks

on:
  push:
    branches:
      - main
      - 'fluxa-*'
    paths:
      - 'fluxa/**'
      - '.github/workflows/fluxa-domain.yml'
  pull_request:
    paths:
      - 'fluxa/**'
      - '.github/workflows/fluxa-domain.yml'
  workflow_dispatch:

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Fluxa JavaScript syntax
        run: |
          for file in fluxa/*.js fluxa/*.mjs; do
            node --check "$file"
          done
      - name: Run Fluxa regression tests
        run: |
          node fluxa/domain.test.mjs
          node fluxa/core-domain-invariants.test.mjs
          node fluxa/session-rules.test.mjs
          node fluxa/store.test.mjs
          node fluxa/protocol-engine.test.mjs
          node fluxa/remaining.test.mjs
          node fluxa/storage-health.test.mjs
          node fluxa/activity-library.test.mjs
          node fluxa/bulk-library.test.mjs
          node fluxa/treatment-planning.test.mjs
          node fluxa/administrative-treatment.test.mjs
          node fluxa/reiki-flex.test.mjs
          node fluxa/reiki-lifecycle.test.mjs
          node fluxa/follow-up-treatment.test.mjs
          node fluxa/structured-preparation.test.mjs
          node fluxa/final-assessment-rules.test.mjs
          node fluxa/report-copy.test.mjs
          node fluxa/ui-idempotency.test.mjs
          node fluxa/ux-conduction.test.mjs
          node fluxa/ux-post-merge-integration.test.mjs
          node fluxa/ux-return-validation.test.mjs
          node fluxa/daily-safety-regressions.test.mjs
          node fluxa/offline-shell.test.mjs
          node fluxa/home-brand-refresh.test.mjs
          node fluxa/therapeutic-catalog.test.mjs
          node fluxa/static-smoke.test.mjs
