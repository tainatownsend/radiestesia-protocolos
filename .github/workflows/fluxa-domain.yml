name: Fluxa domain checks

on:
  push:
    branches:
      - main
      - 'fluxa-*'
    paths:
      - 'fluxa/**'
      - '.github/workflows/fluxa-domain.yml'
  pull_request:
    paths:
      - 'fluxa/**'
      - '.github/workflows/fluxa-domain.yml'
  workflow_dispatch:

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Fluxa JavaScript syntax
        run: |
          for file in fluxa/*.js fluxa/*.mjs; do
            node --check "$file"
          done
      - name: Run all Fluxa regression tests
        run: |
          set -euo pipefail
          mapfile -t tests < <(find fluxa -maxdepth 1 -type f -name '*.test.mjs' -print | sort)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo 'No Fluxa regression tests found.' >&2
            exit 1
          fi
          printf 'Running %s Fluxa regression tests\n' "${#tests[@]}"
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            node "$test_file"
            echo '::endgroup::'
          done
