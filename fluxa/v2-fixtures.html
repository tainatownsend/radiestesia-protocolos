<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f4">
  <title>Fluxa UI V2 · Fixture QA</title>
  <link rel="stylesheet" href="ui-v2/tokens.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--v2-bg);color:var(--v2-text);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.qa{width:min(760px,100%);margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}.qa h1{font-size:clamp(1.8rem,7vw,3rem);line-height:1.02;margin:8px 0 12px}.qa p{color:var(--v2-muted);max-width:65ch}.qa-list{display:grid;gap:8px;margin-top:24px}.qa a{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:12px 16px;border:1px solid var(--v2-border);border-radius:var(--v2-radius-sm);background:var(--v2-surface);color:inherit;text-decoration:none;font-weight:750}.qa a span{color:var(--v2-muted);font-size:.78rem;font-weight:650}.qa-group{margin-top:28px}.qa-group h2{font-size:1rem;margin:0 0 8px}
  </style>
</head>
<body>
  <main class="qa">
    <p>Fluxa · UI V2</p>
    <h1>Visual QA fixtures</h1>
    <p>Estados determinísticos para revisar o fluxo em iPhone sem precisar recriar manualmente cada cenário. Estes links usam o preview seguro, não o armazenamento real do atendimento.</p>
    <div id="fixture-list"></div>
  </main>
  <script type="module">
    import { V2_FIXTURE_ORDER } from './ui-v2/testing/fixtures.js';
    const groups = [
      ['Sessão e pré-requisitos', V2_FIXTURE_ORDER.slice(0,8)],
      ['Investigação e tratamento', V2_FIXTURE_ORDER.slice(8,20)],
      ['Encerramento, Histórico e Acervo', V2_FIXTURE_ORDER.slice(20)],
    ];
    const labels = Object.fromEntries(V2_FIXTURE_ORDER.map((id) => [id, id.replaceAll('-', ' ')]));
    document.querySelector('#fixture-list').innerHTML = groups.map(([title, ids]) => `
      <section class="qa-group"><h2>${title}</h2><div class="qa-list">${ids.map((id, index) => `
        <a href="v2.html?fixture=${encodeURIComponent(id)}"><strong>${labels[id]}</strong><span>${String(index + 1).padStart(2,'0')} →</span></a>
      `).join('')}</div></section>
    `).join('');
  </script>
</body>
</html>
