body{background:var(--bg);font-size:15px;letter-spacing:-.01em;color:var(--ink)}
.shell{background:var(--bg)}
.main{max-width:1190px;padding:20px 18px calc(100px + env(safe-area-inset-bottom))}
.topbar{margin-bottom:17px}.brand{font-size:23px;letter-spacing:-1px;font-weight:820}.logo{width:45px;height:45px;box-shadow:none;background:#ebf5e9;border-radius:17px;font-size:26px}.badge.sand{font-size:11px;padding:7px 12px;color:#ad4c28;background:#fff0e8;letter-spacing:0}
.card{border:1px solid #e3ebe3;box-shadow:var(--shadow);border-radius:22px;background:#fff;padding:17px}.card+.card{margin-top:0}
.btn{border-radius:15px;min-height:43px;padding:9px 15px;letter-spacing:-.025em;font-weight:750}.btn.primary{background:linear-gradient(135deg,#216c53,#174d3c);box-shadow:0 8px 16px rgba(23,82,62,.1)}.btn.subtle{background:#edf6ea;color:#204d3d}
.h2{font-size:21px;letter-spacing:-.8px}.sectionhead{margin:25px 0 12px}.meta{font-size:13px;line-height:1.48;color:var(--sub)}.eyebrow{font-size:10px;letter-spacing:2px;color:#59726a;line-height:1.3}.lead{font-size:15px;line-height:1.45;margin:8px 0 15px;color:var(--sub)}
/* Reference art is drawn from approved mockup; masked edges preserve adaptive composition. */
.art{position:absolute;pointer-events:none;background-position:center;background-repeat:no-repeat;background-size:cover;user-select:none}

lass="card-title">Meus protocolos</h3><div class="meta">Crie, edite, duplique e organize.</div>${btn('Abrir biblioteca →','data-nav="library"','subtle')}</div><div class="art ns-quick-art" aria-hidden="true"></div></div><div class="card ns-quick-card lavender"><span class="ns-quick-icon lav">◷</span><div class="ns-quick-body"><h3 class="card-title">Meu histórico</h3><div class="meta">Sessões, tratamentos e reavaliações.</div>${btn('Ver histórico →','data-nav="history"','subtle')}</div><div class="art ns-quick-art history" aria-hidden="true"></div></div></div><div class="sectionhead"><h2 class="h2">Comece por um modelo</h2></div><div class="card ns-template"><div class="row"><span class="card-icon peach">♧</span><div class="grow"><h3 class="card-title">Vida profissional</h3><div class="meta">12 categorias · Triagem, ramos e aprofundamentos</div></div></div>${btn('Explorar modelo →',`data-action="duplicate-protocol" data-id="${seed.id}"`,'subtle')}<p class="meta long-meta">Modelo baseado no protocolo anterior, agora editável e reutilizável.</p></div><p class="meta" style="margin-top:18px">As respostas radiestésicas são registros interpretativos da prática, não verificações de causas objetivas.</p>`)}

function cardProtocol(p){const n=p.questions.length;const count=db.sessions.filter(s=>s.protocolId===p.id).length;return `<article class="card ns-protocol-card"><div class="art ns-protocol-art" aria-hidden="true"></div><div class="protocol-head"><span class="card-icon peach">${safe(p.icon||'✺')}</span><span class="badge ${p.archived?'neutral':'sand'}">${p.archived?'Arquivado':p.dirty?'Em edição':p.published?'Publicado':'Rascunho'}</span></div><div class="protocol-body"><h3 class="card-title">${safe(p.name)}</h3><p class="meta">${safe(p.description||'Protocolo personalizado')}</p><div class="protocol-stats"><span>▱ ${p.categories.length} categorias</span><span>▤ ${n} perguntas</span><span>◷ ${count} sessões</span></div></div><div class="protocol-actions">${btn(p.published?'Iniciar →':'Publicar para iniciar',`data-action="${p.published?'start-session':'edit-protocol'}" data-id="${p.id}"`,'primary smallbtn')}${btn('Editar',`data-action="edit-protocol" data-id="${p.id}"`,'smallbtn')}${btn('Duplicar',`data-action="duplicate-protocol" data-id="${p.id}"`,'smallbtn')}${btn(p.archived?'Restaurar':'⋯',`aria-label="Outras opções de ${safe(p.name)}" data-action="${p.archived?'restore-protocol':'protocol-menu'}" data-id="${p.id}"`,'smallbtn')}</div></article>`}

function renderLibrary(){const cats=['all','archived',...new Set(db.protocols.filter(p=>!p.archived).map(p=>p.category))];const filtered=db.protocols.filter(p=>(ui.categoryFilter==='archived'?p.archived:!p.archived)&&(ui.categoryFilter==='all'||ui.categoryFilter==='archived'||p.category===ui.categoryFilter)&&[p.name,p.description,p.category].join(' ').toLowerCase().includes(ui.query.toLowerCase()));shell(`<section class="ns-library-intro"><div class="eyebrow">SUA BIBLIOTECA</div><h1 class="title">Meus protocolos</h1><p class="lead">Um lugar para criar, organizar e reutilizar seus roteiros.</p><div class="art ns-library-art" aria-hidden="true"></div></section><div class="ns-search-row"><input class="search" id="searchProtocols" aria-label="Buscar protocolos" placeholder="Buscar protocolos..." value="${safe(ui.query)}">${btn('＋ Criar','data-action="new-protocol"','primary')}</div><div class="pills">${cats.map(c=>`<button class="pill ${ui.categoryFilter===c?'active':''}" data-filter="${safe(c)}">${c==='all'?'Todos':c==='archived'?'Arquivados':safe(c)}</button>`).join('')}</div><div class="ns-protocol-list">${filtered.map(cardProtocol).join('')||'<div class="empty">Nenhum protocolo encontrado. Crie um novo ou ajuste a busca.</div>'}</div><div class="sectionhead"><h2 class="h2">Modelos</h2></div><div class="card ns-model"><div class="model-copy"><div class="row"><span class="card-icon lav">▤</span><div><strong>Modelo de vida profissional</strong><div class="meta">Comece com uma cópia editável do protocolo completo.</div></div></div>${btn('Criar cópia do modelo →',`data-action="duplicate-protocol" data-id="${seed.id}"`,'subtle')}</div><div class="art ns-model-art" aria-hidden="true"></div></div>`)}

function newProtocol(){ui.protocolId=null;ui.editQuestionId=null;shell(`${back('library')}<h1 class="title">Novo protocolo</h1><p class="lead">Comece com o essencial. Você adicionará categorias e perguntas na próxima tela.</p><div class="card" style="max-width:720px"><form id="protocolForm"><div class="field"><label for="pname">Nome do protocolo *</label><input id="pname" name="name" required maxlength="90" placeholder="Ex.: Investigação de imóveis"></div><div class="field"><label for="pdesc">Descrição</label><textarea id="pdesc" name="description" placeholder="O que você deseja investigar?"></textarea></div><div class="field"><label for="pcat">Categoria</label><input id="pcat" name="category" maxlength="40" placeholder="Ex.: Imóveis, Pessoal, Profissional"></div><div class="form-actions"><button class="btn primary" type="submit">Criar e abrir editor →</button>${btn('Cancelar','data-nav="library"')}</div></form></div>`)}
function editProtocol(){const p=protocol();if(!p)return go('library');const cat=p.categories[0];shell(`<div class="row between wrap">${back('library','Biblioteca')}<span class="badge">${p.dirty?'Alterações não publicadas':p.published?'Publicado v'+p.version:'Rascunho'}</span></div><div class="eyebrow" style="margin-top:20px">EDITOR DE PROTOCOLOS</div><h1 class="title">${safe(p.name)}</h1><p class="lead">Adicione categorias, crie perguntas e configure os caminhos de resposta.</p><div class="tabbar"><button class="tab ${ui.editorTab==='cards'?'active':''}" data-tab="cards">▤ Cartões</button><button class="tab ${ui.editorTab==='tree'?'active':''}" data-tab="tree">⑂ Árvore</button></div><div class="twoCol"><div><div class="card"><div class="row between"><h2 class="h2">Identificação</h2>${btn('Salvar','data-action="save-details"','subtle smallbtn')}</div><div class="field" style="margin-top:15px"><span>Nome</span><input id="editName" maxlength="90" value="${safe(p.name)}"></div><div class="field"><span>Descrição</span><textarea id="editDesc">${safe(p.description)}</textarea></div><div class="field"><span>Categoria</span><input id="editCategory" maxlength="40" value="${safe(p.category)}"></div></div><div class="card"><div class="row between"><h2 class="h2">Categorias</h2><span class="badge">${p.categories.length}</span></div><div style="margin:10px 0">${p.categories.map(c=>`<div class="itemline"><span class="grow">${safe(c.name)}</span>${btn('Renomear',`data-action="rename-category" data-id="${c.id}"`,'smallbtn')}</div>`).join('')||'<p class="meta">Ainda não há categorias.</p>'}</div><form id="categoryForm" class="row"><input class="search" style="min-width:0" name="name" required maxlength="70" aria-label="Nome da categoria" placeholder="Nova categoria..."/><button class="btn primary" type="submit" style="flex-shrink:0">＋</button></form></div></div><div><div class="card"><div class="row between"><h2 class="h2">${ui.editorTab==='cards'?'Perguntas':'Mapa das perguntas'}</h2><span class="badge">${p.questions.length}</span></div><p class="meta" style="margin:8px 0 13px">${ui.editorTab==='cards'?'Edite uma pergunta por vez. Os códigos são gerados automaticamente.':'Ramos recolhíveis para uma revisão confortável no celular.'}</p>${ui.editorTab==='cards'?p.categories.map(c=>`<div style="margin-top:13px"><div class="eyebrow" style="margin-bottom:8px">${safe(c.name)}</div>${p.questions.filter(q=>q.catId===c.id&&!q.parentId).map(q=>questionCard(p,q)).join('')||'<div class="meta">Nenhuma pergunta nesta categoria.</div>'}</div>`).join(''):p.categories.map(c=>`<details open class="treehead"><summary><strong>${safe(c.name)}</strong> <span class="meta">(${p.questions.filter(q=>q.catId===c.id).length})</span></summary><div style="padding-top:8px">${p.questions.filter(q=>q.catId===c.id&&!q.parentId).map(q=>treeNode(p,q)).join('')||'<div class="meta">Categoria vazia.</div>'}</div></details>`).join('')}${btn('＋ Adicionar pergunta','data-action="new-question"','primary wide')}</div><div class="card soft"><h3 class="h3">Pronto para testar?</h3><p class="meta">Simule as ramificações antes de publicar uma versão estável.</p><div class="form-actions">${btn('▶ Testar protocolo',`data-action="start-session" data-id="${p.id}" data-preview="true"`,'subtle')}${btn('Publicar versão',`data-action="publish" data-id="${p.id}"`,'primary')}</div></div></div></div>`)}
function questionCard(p,q){const kids=p.questions.filter(x=>x.parentId===q.id);return `<div class="questionitem"><div class="row between"><span class="questioncode">${safe(q.code)}</span><span class="badge neutral">${typeName(q.type)}</span></div><p style="margin:8px 0">${safe(q.text)}</p>${q.parentId?`<div class="branch">Exibir ${safe(whenText(q.when))}</div>`:''}<div class="item-actions">${btn('Editar',`data-action="edit-question" data-id="${q.id}"`,'smallbtn')}${btn('＋ Subpergunta',`data-action="add-child" data-id="${q.id}"`,'subtle smallbtn')}${btn('Duplicar',`data-action="dup-question" data-id="${q.id}"`,'smallbtn')}</div>${kids.length?`<details style="margin-top:12px"><summary class="meta">${kids.length} subpergunta(s)</summary><div class="treechildren">${kids.map(k=>questionCard(p,k)).join('')}</div></details>`:''}</div>`}
function treeNode(p,q){return `<div class="questionitem" style="padding:10px;margin-top:6px"><div class="questioncode">${safe(q.code)} ${q.parentId?'· '+safe(whenText(q.when)):''}</div><div class="row between"><span class="grow" style="font-size:13px">${safe(q.text)}</span>${btn('✎',`aria-label="Editar pergunta ${safe(q.code)}" data-action="edit-question" data-id="${q.id}"`,'smallbtn')}</div>${p.questions.some(k=>k.parentId===q.id)?`<div class="treechildren">${p.questions.filter(k=>k.parentId===q.id).map(k=>treeNode(p,k)).join('')}</div>`:''}</div>`}
function typeName(t){return {yn:'Sim / Não',pct:'Percentual',both:'Sim / Não + %',text:'Texto',info:'Orientação'}[t]||t}function whenText(w){return {yes:'se Sim',no:'se Não',gte:'se percentual ≥ limite',lt:'se percentual < limite',always:'após a pergunta'}[w]||w}
function newQuestion(){const p=protocol();if(!p)return go('library');if(!p.categories.length){toast('Adicione uma categoria antes de criar a pergunta.');return go('editor')}const q=p.questions.find(x=>x.id===ui.editQuestionId);const cat=q?.catId||ui.prefillCat||p.categories[0].id;const parent=q?.parentId||ui.prefillParent||'';shell(`${back('editor','Editor')}<div class="eyebrow" style="margin-top:18px">${q?'EDITAR PERGUNTA':'NOVA PERGUNTA'}</div><h1 class="title">${q?'Refine esta pergunta':'Uma pergunta por vez.'}</h1><div class="card" style="max-width:780px"><form id="questionForm"><div class="field"><label for="qcat">Categoria</label><select id="qcat" name="catId">${p.categories.map(c=>`<option value="${c.id}" ${cat===c.id?'selected':''}>${safe(c.name)}</option>`).join('')}</select></div><div class="field"><label for="qtext">Pergunta ou instrução *</label><textarea id="qtext" name="text" required placeholder="Escreva a pergunta exatamente como deseja vê-la durante a investigação">${safe(q?.text||'')}</textarea></div><div class="field"><label for="qtype">Tipo de resposta</label><select name="type" id="qtype">${['yn','pct','both','text','info'].map(t=>`<option value="${t}" ${(q?.type||'both')===t?'selected':''}>${typeName(t)}</option>`).join('')}</select></div><hr class="divider"><h2 class="h3" style="margin-bottom:11px">Quando esta pergunta deve aparecer?</h2><div class="field"><label for="qparent">Pergunta anterior (opcional)</label><select name="parentId" id="qparent"><option value="">Início desta categoria (pergunta principal)</option>${p.questions.filter(x=>x.id!==q?.id&&x.catId===cat&&!isDescendant(p,x.id,q?.id)).map(x=>`<option value="${x.id}" ${parent===x.id?'selected':''}>${safe(x.code)} · ${safe(x.text.slice(0,80))}</option>`).join('')}</select><small>Selecione uma pergunta para criar uma subpergunta e determinar sua condição.</small></div><div class="field" id="conditionFields"><label for="qwhen">Condição</label><select id="qwhen" name="when"><option value="yes" ${(q?.when||'yes')==='yes'?'selected':''}>Quando a resposta for Sim</option><option value="no" ${q?.when==='no'?'selected':''}>Quando a resposta for Não</option><option value="gte" ${q?.when==='gte'?'selected':''}>Quando o percentual for igual ou maior que...</option><option value="lt" ${q?.when==='lt'?'selected':''}>Quando o percentual for menor que...</option><option value="always" ${q?.when==='always'?'selected':''}>Após responder à pergunta anterior</option></select></div><div class="field" id="thresholdFields"><label for="qthreshold">Percentual de referência (0 a 100)</label><input type="number" name="threshold" id="qthreshold" min="0" max="100" step="1" value="${q?.threshold??50}"></div><div class="note">O editor impede ramificações circulares e caminhos incompatíveis com o tipo de resposta.</div><div class="form-actions"><button class="btn primary" type="submit">${q?'Salvar alterações':'Salvar pergunta'} →</button>${q?btn('Excluir pergunta',`data-action="delete-question" data-id="${q.id}"`,'danger'):btn('Cancelar','data-nav="editor"')}</div></form></div>`);conditionVisibility()}
function isDescendant(p,maybeChild,ancestor){if(!ancestor)return false;let c=p.questions.find(x=>x.id===maybeChild);while(c?.parentId){if(c.parentId===ancestor)return true;c=p.questions.find(x=>x.id===c.parentId)}return false}
function conditionVisibility(){const parent=document.querySelector('#qparent');if(!parent)return;const has=!!parent.value;const row=document.querySelector('#conditionFields');const threshold=document.querySelector('#thresholdFields');row?.classList.toggle('hide',!has);threshold?.classList.toggle('hide',!has||!['gte','lt'].includes(document.querySelector('#qwhen')?.value));const p=protocol();const par=p.questions.find(x=>x.id===parent.value);const when=document.querySelector('#qwhen');if(par&&when){[...when.options].forEach(o=>{o.disabled=(['yes','no'].includes(o.value)&&!['yn','both'].includes(par.type))||(['gte','lt'].includes(o.value)&&!['pct','both'].includes(par.type))});if(when.selectedOptions[0]?.disabled)when.value='always';threshold?.classList.toggle('hide',!['gte','lt'].includes(when.value))}}
function reCodes(p){let n=0;const walk=(parent,prefix)=>{let i=0;for(const q of p.questions.filter(x=>x.parentId===parent)){i++;q.code=parent?`${prefix}.${i}`:`M${String(++n).padStart(2,'0')}`;walk(q.id,q.code)}};for(const c of p.categories){let i=0;for(const q of p.questions.filter(x=>x.catId===c.id&&!x.parentId)){q.code=`M${String(++n).padStart(2,'0')}`;walk(q.id,q.code)}}}
function validate(p){if(!p.categories.length)return 'Adicione ao menos uma categoria.';if(!p.questions.length)return 'Adicione ao menos uma pergunta.';const seen=new Set();for(const q of p.questions){if(!q.text.trim())return 'Existe uma pergunta sem texto.';if(!p.categories.some(c=>c.id===q.catId))return 'Uma pergunta usa categoria inexistente.';if(!q.parentId)continue;const parent=p.questions.find(x=>x.id===q.parentId);if(!parent)return 'Uma subpergunta aponta para uma pergunta inexistente.';if(parent.catId!==q.catId)return 'Uma subpergunta está em categoria diferente da pergunta principal.';if(['yes','no'].includes(q.when)&&!['yn','both'].includes(parent.type))return `Condição binária incompatível em ${q.code}.`;if(['gte','lt'].includes(q.when)&&!['pct','both'].includes(parent.type))return `Condição percentual incompatível em ${q.code}.`;let t=parent;seen.clear();seen.add(q.id);while(t){if(seen.has(t.id))return 'O protocolo contém um ciclo entre perguntas.';seen.add(t.id);t=p.questions.find(x=>x.id===t.parentId)}}return null}
function startSession(p,preview=false,reevalOf=null){if(!p)return;const err=validate(p);if(err){toast(err);ui.protocolId=p.id;ui.editorTab='cards';return go('editor')}if(!preview&&!p.published){toast('Publique a primeira versão antes de iniciar uma investigação.');ui.protocolId=p.id;return go('editor')}const version=(preview?p:(p.publishedSnapshot||p));const s={id:id(),protocolId:p.id,protocolTitle:version.name,version:version.version, snapshot:clone(version),context:'',created:now(),updated:now(),status:'active',answers:{},treatments:[],preview,reevalOf};db.sessions.unshift(s);persist();ui.sessionId=s.id;ui.step=0;go('runner')}
function sortedQuestions(p){let out=[];const visit=q=>{out.push(q);p.questions.filter(k=>k.parentId===q.id).forEach(visit)};p.categories.forEach(c=>p.questions.filter(q=>q.catId===c.id&&!q.parentId).forEach(visit));return out}
function completed(q,a){return q.type==='info'||(q.type==='yn'&&['sim','nao'].includes(a?.yn))||(q.type==='pct'&&a?.pct!==undefined&&a?.pct!=='')||(q.type==='both'&&['sim','nao'].includes(a?.yn))||(q.type==='text'&&!!a?.text?.trim())}
function applicable(s){const qs=snapshotQuestions(s);const byId=new Map(qs.map(q=>[q.id,q]));return qs.filter(q=>{if(!q.parentId)return true;const parent=byId.get(q.parentId);if(!parent)return false;const a=s.answers[parent.id];if(!completed(parent,a))return false;const v=a?.pct;const test={yes:()=>a?.yn==='sim',no:()=>a?.yn==='nao',gte:()=>v!==undefined&&v!==''&&Number(v)>=Number(q.threshold),lt:()=>v!==undefined&&v!==''&&Number(v)<Number(q.threshold),always:()=>true}[q.when];if(!test||!test())return false;let ancestor=parent;while(ancestor.parentId){const grand=byId.get(ancestor.parentId);if(!grand||!visibleCondition(grand,ancestor,s.answers[grand.id]))return false;ancestor=grand}return true})}
function visibleCondition(parent,child,a){if(!completed(parent,a))return false;if(child.when==='always')return true;if(child.when==='yes')return a?.yn==='sim';if(child.when==='no')return a?.yn==='nao';if(a?.pct===undefined||a.pct==='')return false;if(child.when==='gte')return Number(a.pct)>=Number(child.threshold);if(child.when==='lt')return Number(a.pct)<Number(child.threshold);return false}
function snapshotQuestions(s){return sortedQuestions(s.snapshot)}
function renderRunner(){const s=session();if(!s)return go('history');const qs=applicable(s);if(!qs.length)return go('history');ui.step=Math.max(0,Math.min(ui.step,qs.length-1));const q=qs[ui.step],a=s.answers[q.id]||{},done=qs.filter(x=>completed(x,s.answers[x.id])).length;const pct=Math.round(done/qs.length*100);const cat=s.snapshot.categories.find(x=>x.id===q.catId);shell(`<div class="row between wrap">${back('history','Sair')}<span class="badge ${s.preview?'sand':''}">${s.preview?'Simulação':'Sessão em andamento'}</span></div><div style="max-width:650px;margin:19px auto 0"><div class="eyebrow">${safe(s.protocolTitle)}</div><h1 class="title">Investigação guiada</h1><div class="row between"><span class="meta">${done} de ${qs.length} perguntas disponíveis respondidas</span><span class="meta">${pct}%</span></div><div class="progress" style="margin:10px 0 23px"><div style="width:${pct}%"></div></div><div class="card runner-question-card"><div class="row between wrap"><span class="badge">${safe(q.code)} · ${safe(cat?.name||'Categoria')}</span><span class="meta">${ui.step+1} / ${qs.length}</span></div><h2 style="font-size:clamp(21px,5vw,27px);line-height:1.3;letter-spacing:-.5px;margin:24px 0 12px">${safe(q.text)}</h2><p class="meta" style="margin-bottom:24px">${q.type==='info'?'Leia a orientação e avance.':q.type==='yn'?'Toque em Sim ou Não para continuar automaticamente.':'Registre a resposta obtida durante sua prática.'}</p>${['yn','both'].includes(q.type)?`<div class="choices"><button class="choice ${a.yn==='sim'?'selected':''}" data-answer="sim" aria-pressed="${a.yn==='sim'}">✓ Sim</button><button class="choice ${a.yn==='nao'?'selected':''}" data-answer="nao" aria-pressed="${a.yn==='nao'}">✕ Não</button></div>`:''}${['pct','both'].includes(q.type)?`<div class="field" style="margin-top:18px"><label for="answerPct">Percentual registrado (0 a 100) ${q.type==='both'?'· opcional':''}</label><div class="percent-stepper"><button type="button" class="pct-step" data-action="pct-step" data-delta="-5" aria-label="Diminuir percentual em 5" ${q.type==='both'&&!a.yn||a.pct===0?'disabled':''}>−</button><div class="pct-input-wrap"><input id="answerPct" type="number" min="0" max="100" step="1" inputmode="numeric" aria-label="Percentual registrado" value="${a.pct??''}" placeholder="0" ${q.type==='both'&&!a.yn?'disabled':''}><span class="pct-unit">%</span></div><button type="button" class="pct-step" data-action="pct-step" data-delta="5" aria-label="Aumentar percentual em 5" ${q.type==='both'&&!a.yn||a.pct===100?'disabled':''}>+</button></div><div class="percent-presets" aria-label="Percentuais rápidos">${[0,25,50,75,100].map(v=>`<button type="button" class="pct-chip ${a.pct===v?'selected':''}" data-action="pct-preset" data-value="${v}" aria-label="Registrar ${v} por cento e continuar" ${q.type==='both'&&!a.yn?'disabled':''}>${v}%</button>`).join('')}</div><p class="runner-hint">${q.type==='both'&&!a.yn?'Escolha Sim ou Não para liberar o percentual.':q.type==='both'?'Use − / + de 5 em 5, escolha um valor rápido ou continue sem percentual.':'Use − / + de 5 em 5 ou toque em um valor rápido para continuar.'}</p></div>`:''}${q.type==='text'?`<div class="field"><label for="answerText">Sua resposta</label><textarea id="answerText" placeholder="Registre sua interpretação...">${safe(a.text||'')}</textarea></div>`:''}<hr class="divider"><div class="row between wrap">${btn('← Anterior','data-action="previous-question"','')}${q.type==='yn'?'<span class="meta">Sim/Não avança automaticamente</span>':btn(q.type==='both'&&a.pct===undefined?'Continuar sem percentual →':ui.step===qs.length-1?'Concluir investigação →':'Próxima pergunta →','data-action="next-question"','primary')}</div></div><div class="note" style="margin-top:14px">Uma resposta anterior pode alterar os próximos ramos. Respostas de caminhos desativados não aparecem nos resultados.</div><p class="meta" style="margin:13px 2px">${s.preview?'Simulação local: exclua depois se não quiser manter este registro.':'As alterações são salvas localmente neste protótipo, não na nuvem.'}</p></div>`)}
function positive(s){return applicable(s).filter(q=>{const a=s.answers[q.id];if(!completed(q,a))return false;return a?.yn==='sim'||(a?.pct!==undefined&&a.pct!==''&&Number(a.pct)>0)}).map(q=>({q,a:s.answers[q.id],cat:s.snapshot.categories.find(c=>c.id===q.catId)?.name||'Categoria'}))}
function finishSession(s){const available=applicable(s);const missing=available.filter(q=>!completed(q,s.answers[q.id]));if(missing.length){ui.step=available.findIndex(q=>q.id===missing[0].id);toast(`Responda a pergunta ${missing[0].code} antes de concluir.`);return renderRunner()}s.status='done';s.updated=now();persist();ui.reportSession=s.id;go('report')}
function renderReport(){const s=session(ui.reportSession||ui.sessionId);if(!s)return go('history');const results=positive(s);shell(`<div class="row between wrap">${back('history','Histórico')}<span class="badge">${s.status==='done'?'✓ Concluída':'Em andamento'}</span></div><section class="ns-report-intro"><div class="eyebrow">RESULTADO DA INVESTIGAÇÃO</div><h1 class="title">${safe(s.protocolTitle)}</h1><p class="lead">${fmt(s.created)} · ${safe(s.context||'Investigação pessoal')} ${s.reevalOf?'· Reavaliação':''}</p><div class="art ns-report-art" aria-hidden="true"></div></section><div class="card ns-result-card"><div class="ns-result-head"><span class="card-icon lav">▥</span><div><h2 class="h2">Resultados registrados</h2></div><span class="badge">${results.length} itens</span></div><p class="meta ns-report-result-note">Apenas respostas “Sim” ou percentuais maiores que 0%. Valores registram a interpretação da prática, não uma medida objetiva de bloqueios.</p><div class="ns-result-items">${results.length?results.map(({q,a,cat})=>`<article class="resultitem"><div class="eyebrow">${safe(q.code)} · ${safe(cat)}</div><p>${safe(q.text)}</p><div class="dots">${a.yn?`<span class="badge ${a.yn==='sim'?'':'neutral'}">${a.yn==='sim'?'Sim':'Não'}</span>`:''}${a.pct!==undefined&&a.pct!==''?`<span class="badge">${Number(a.pct)}%</span>`:''}</div></article>`).join(''):'<div class="empty">Nenhuma resposta atende ao filtro positivo. A sessão completa continua disponível no histórico.</div>'}</div></div><div class="ns-followups"><div class="card ns-followup"><div class="ns-followup-head"><span class="card-icon">▤</span><div><h3 class="h3">Plano de tratamento</h3><p class="meta">Com base nos resultados, organize as próximas ações para sua jornada.</p></div></div><div class="art ns-followup-art" aria-hidden="true"></div>${btn('Explorar plano de tratamento →',`data-action="treat-session" data-id="${s.id}"`,'primary wide')}</div><div class="card ns-followup"><div class="ns-followup-head"><span class="card-icon lav">◷</span><div><h3 class="h3">Reavaliação</h3><p class="meta">Registre outra sessão do mesmo protocolo sem alterar as respostas originais.</p></div></div><div class="art ns-followup-art reassess" aria-hidden="true"></div>${btn('Iniciar reavaliação',`data-action="reassess" data-id="${s.id}"`,'subtle wide')}</div></div>${s.treatments?.length?`<div class="sectionhead"><h2 class="h2">Tratamentos vinculados</h2></div>${s.treatments.map(t=>`<div class="card"><strong>${safe(t.name)}</strong><div class="meta">${fmt(t.date)} · ${safe(t.technique)}</div><p>${safe(t.description)}</p>${t.review?`<div class="badge">Reavaliar: ${safe(t.review)}</div>`:''}</div>`).join('')}`:''}<div class="ns-print">${btn('▤ Imprimir resultados','data-action="print"','subtle wide')}</div>`)}

function renderTreatment(){const s=session(ui.treatSession);if(!s)return go('history');shell(`${back('report','Resultados')}<div class="eyebrow" style="margin-top:18px">PLANO DE ACOMPANHAMENTO</div><h1 class="title">Novo tratamento</h1><p class="lead">Vinculado à investigação ${safe(s.protocolTitle)}. Você pode utilizar um modelo ou escrever livremente.</p><div class="card" style="max-width:740px"><form id="treatmentForm"><div class="field"><label for="template">Começar por</label><select id="template"><option value="">Tratamento livre</option>${db.templates.map(t=>`<option value="${t.id}">${safe(t.name)}</option>`).join('')}</select></div><div class="field"><label for="tname">Nome *</label><input required id="tname" name="name" placeholder="Ex.: Limpeza simbólica geral"></div><div class="field"><label for="ttech">Técnica ou recurso utilizado</label><input id="ttech" name="technique" placeholder="Ex.: Pêndulo, biômetro, gráfico radiônico"></div><div class="field"><label for="tdesc">Prática e observações</label><textarea id="tdesc" name="description" placeholder="Descreva sua prática..."></textarea></div><div class="treatment-dates"><div class="field"><label for="tdate">Data</label><input id="tdate" name="date" type="date" value="${localToday()}"></div><div class="field"><label for="treview">Reavaliar em</label><input id="treview" name="review" type="date"></div></div><label class="row meta" style="margin-bottom:14px"><input id="saveTemplate" type="checkbox" style="width:20px;height:20px"> Salvar também como modelo reutilizável</label><div class="notice">Tratamentos aqui são registros de práticas simbólicas; observe separadamente mudanças concretas no contexto investigado.</div><div class="form-actions"><button class="btn primary" type="submit">Salvar tratamento →</button>${btn('Cancelar','data-nav="report"')}</div></form></div>`)}
function renderHistory(){const entries=[...db.sessions].sort((a,b)=>b.updated.localeCompare(a.updated));shell(`<div class="eyebrow">SUAS SESSÕES</div><h1 class="title">Meu histórico</h1><p class="lead">Investigações, tratamentos e reavaliações organizados por data.</p>${entries.length?entries.map(s=>`<div class="card"><div class="row between wrap"><span class="badge ${s.status==='active'?'sand':''}">${s.status==='active'?'Em andamento':'Concluída'}</span><span class="meta">${fmt(s.created)}</span></div><h2 class="card-title">${safe(s.protocolTitle)}</h2><p class="meta">${s.reevalOf?'Reavaliação · ':''}${s.treatments?.length||0} tratamento(s) · ${Object.keys(s.answers).length} respostas salvas</p><div class="item-actions">${btn(s.status==='active'?'Continuar →':'Ver resultados →',`data-action="${s.status==='active'?'open-session':'open-report'}" data-id="${s.id}"`,'primary smallbtn')}${s.status==='done'?btn('Reavaliar',`data-action="reassess" data-id="${s.id}"`,'smallbtn'):''}${btn('Excluir',`data-action="delete-session" data-id="${s.id}"`,'danger smallbtn')}</div></div>`).join(''):'<div class="empty">Seu histórico ainda está vazio. Inicie uma investigação pela biblioteca.</div>'}`)}
function renderMore(){shell(`<div class="eyebrow">CONFIGURAÇÕES DA PRÉVIA</div><h1 class="title">Mais</h1><div class="card"><h2 class="h2">Seus dados de teste</h2><p class="meta">Esta prévia salva informações no navegador atual. Não há conta, servidor, sincronização nem backup automático. Evite registrar dados pessoais ou sensíveis reais.</p><div class="item-actions">${btn('Exportar backup (.json)','data-action="export"','primary')}${btn('Importar backup','data-action="import"','subtle')}${btn('Restaurar demonstração','data-action="reset"','danger')}</div><input id="importFile" class="hide" type="file" accept="application/json,.json"></div><div class="card"><h2 class="h2">O que validamos aqui</h2><p class="meta">Criação, edição, duplicação, ramificações Sim/Não e percentual, relatório positivo, modelos de tratamento e reavaliação. Login, banco de dados e publicação ainda não fazem parte do protótipo.</p></div><div class="card"><h2 class="h2">Privacidade e método</h2><p class="meta">O Sintonizze organiza registros de práticas radiestésicas. Respostas não estabelecem causas objetivas, diagnósticos clínicos, interferências de terceiros ou eficácia de tratamentos.</p></div>`)}
function render(){switch(ui.route){case'home':return renderHome();case'library':return renderLibrary();case'new-protocol':return newProtocol();case'editor':return editProtocol();case'new-question':return newQuestion();case'runner':return renderRunner();case'report':return renderReport();case'treatment':return renderTreatment();case'history':return renderHistory();case'more':return renderMore();default:go('home')}}
function duplicate(p){const cp=clone(p);delete cp.publishedSnapshot;cp.dirty=false;cp.id=id();cp.name=`${p.name} · Cópia`;cp.version=0;cp.published=false;cp.archived=false;cp.created=now();cp.updated=now();db.protocols.unshift(cp);persist();ui.protocolId=cp.id;ui.editorTab='cards';go('editor');toast('Cópia criada. O original permanece intacto.')}
function mutateAnswer(field,value){const s=session();if(!s)return;const qs=applicable(s),q=qs[ui.step];if(!q)return;const ans={...(s.answers[q.id]||{})};if(value===null)delete ans[field];else ans[field]=value;s.answers[q.id]=ans;s.updated=now();persist();if(field==='yn'){if(q.type==='yn')return advanceRunner();return renderRunner()}}
function setRunnerPercent(value){const n=Number(value);if(!Number.isFinite(n)||n<0||n>100)return;mutateAnswer('pct',n);const input=document.querySelector('#answerPct');if(input)input.value=String(n);const minus=document.querySelector('[data-action="pct-step"][data-delta="-5"]'),plus=document.querySelector('[data-action="pct-step"][data-delta="5"]');if(minus)minus.disabled=n<=0;if(plus)plus.disabled=n>=100;document.querySelectorAll('.pct-chip').forEach(b=>b.classList.toggle('selected',Number(b.dataset.value)===n));const next=document.querySelector('[data-action="next-question"]');if(next&&next.textContent.includes('Continuar sem percentual'))next.textContent='Próxima pergunta →'}
function advanceRunner(){const s=session();if(!s)return;const qs=applicable(s),q=qs[ui.step];if(!q||!completed(q,s.answers[q.id]))return toast('Registre a resposta para continuar.');const missing=qs.findIndex((t,i)=>i>ui.step&&!completed(t,s.answers[t.id]));if(missing>=0){ui.step=missing;window.scrollTo(0,0);return renderRunner()}const other=qs.findIndex(t=>!completed(t,s.answers[t.id]));if(other>=0){ui.step=other;window.scrollTo(0,0);return renderRunner()}window.scrollTo(0,0);return finishSession(s)}
function handleAction(action,el){const x=el.dataset.id;const p=protocol(x);switch(action){case'new-protocol':return go('new-protocol');case'edit-protocol':ui.protocolId=x;ui.editorTab='cards';return go('editor');case'duplicate-protocol':return duplicate(p||seed);case'restore-protocol':p.archived=false;persist();go('library');return toast('Protocolo restaurado.');case'protocol-menu':{const op=prompt(`O que fazer com “${p.name}”?\nDigite: renomear, ${p.archived?'restaurar':'arquivar'} ou excluir`);if(!op)return;if(op.toLowerCase()==='renomear'){ui.protocolId=x;return go('editor')}if(op.toLowerCase()==='arquivar'){p.archived=true;persist();toast('Protocolo arquivado.');return go('library')}if(op.toLowerCase()==='restaurar'){p.archived=false;persist();toast('Protocolo restaurado.');return go('library')}if(op.toLowerCase()==='excluir'){if(db.sessions.some(s=>s.protocolId===p.id)){toast('Há sessões vinculadas. Arquive em vez de excluir.');return}if(confirm('Excluir este protocolo sem histórico?')){db.protocols=db.protocols.filter(i=>i.id!==x);persist();go('library')}}return}
case'save-details':{const pr=protocol();pr.name=document.querySelector('#editName').value.trim()||pr.name;pr.description=document.querySelector('#editDesc').value.trim();pr.category=document.querySelector('#editCategory').value.trim()||'Pessoal';pr.updated=now();pr.dirty=true;persist();go('editor');return toast('Rascunho salvo. Publique para usar esta versão.')}
case'rename-category':{const pr=protocol();const c=pr.categories.find(t=>t.id===x);const v=prompt('Novo nome da categoria:',c?.name);if(v?.trim()){c.name=v.trim();pr.dirty=true;persist();go('editor')}return}
case'new-question':ui.editQuestionId=null;ui.prefillParent='';ui.prefillCat='';return go('new-question');case'edit-question':ui.editQuestionId=x;ui.prefillParent='';return go('new-question');case'add-child':{const pr=protocol();ui.editQuestionId=null;ui.prefillParent=x;ui.prefillCat=pr.questions.find(q=>q.id===x)?.catId;return go('new-question')}
case'dup-question':{const pr=protocol();const orig=pr.questions.find(q=>q.id===x);const cp={...clone(orig),id:id(),text:orig.text+' (cópia)'};pr.questions.splice(pr.questions.indexOf(orig)+1,0,cp);reCodes(pr);pr.dirty=true;persist();return go('editor')}
case'delete-question':{const pr=protocol();const q=pr.questions.find(t=>t.id===x);if(pr.questions.some(k=>k.parentId===x)){toast('Exclua as subperguntas antes de excluir esta pergunta.');return}if(confirm(`Excluir ${q.code}?`)){pr.questions=pr.questions.filter(z=>z.id!==x);reCodes(pr);pr.dirty=true;persist();ui.editQuestionId=null;go('editor')}return}
case'publish':{const pr=protocol(x),err=validate(pr);if(err)return toast(err);pr.version++;pr.published=true;pr.dirty=false;pr.updated=now();pr.publishedSnapshot=clone({...pr,publishedSnapshot:undefined});persist();go('editor');return toast(`Versão ${pr.version} publicada nesta prévia local.`)}
case'start-session':return startSession(protocol(x),el.dataset.preview==='true');case'open-session':ui.sessionId=x;ui.step=applicable(session(x)).findIndex(q=>!completed(q,session(x).answers[q.id]));if(ui.step<0)ui.step=0;return go('runner');case'previous-question':ui.step=Math.max(0,ui.step-1);window.scrollTo(0,0);return renderRunner();case'pct-step':{const s=session(),q=applicable(s)[ui.step],input=document.querySelector('#answerPct');if(!s||!q||!input||input.disabled)return;const raw=input.value.trim();const current=raw===''?0:Number(raw);return setRunnerPercent(Math.max(0,Math.min(100,current+Number(el.dataset.delta))))}case'pct-preset':{const s=session(),q=applicable(s)[ui.step],input=document.querySelector('#answerPct');if(!s||!q||!input||input.disabled)return;setRunnerPercent(Number(el.dataset.value));return advanceRunner()}case'next-question':return advanceRunner()
case'open-report':ui.reportSession=x;ui.sessionId=x;return go('report');case'treat-session':ui.treatSession=x;ui.reportSession=x;return go('treatment');case'reassess':{const source=session(x),pr=source?.snapshot;if(!pr)return;return startSession(pr,false,source.reevalOf||source.id)}case'delete-session':if(confirm('Excluir definitivamente esta sessão de demonstração?')){db.sessions=db.sessions.filter(s=>s.id!==x);persist();go('history')}return;
case'print':return window.print();case'export':{const blob=new Blob([JSON.stringify({schema:1,data:db},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sintonizze-prototipo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);return toast('Backup de demonstração exportado.')}
case'import':return document.querySelector('#importFile')?.click();case'reset':if(confirm('Apagar dados locais do protótipo e restaurar o modelo de demonstração?')){db={protocols:[clone(seed)],sessions:[],templates:[{id:'t-general',name:'Limpeza simbólica geral',technique:'Prática simbólica conhecida',description:'Registrar intenção, técnica e observações.'}]};persist();ui.categoryFilter='all';ui.query='';go('home')}return;
}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav],[data-action],[data-filter],[data-tab],[data-answer]');if(!n||n.disabled)return;if(n.dataset.nav)return go(n.dataset.nav);if(n.dataset.action)return handleAction(n.dataset.action,n);if(n.dataset.filter!==undefined){ui.categoryFilter=n.dataset.filter;return go('library')}if(n.dataset.tab){ui.editorTab=n.dataset.tab;return render()}if(n.dataset.answer)return mutateAnswer('yn',n.dataset.answer)});
document.addEventListener('input',e=>{if(e.target.id==='searchProtocols'){ui.query=e.target.value;const cursor=e.target.selectionStart;renderLibrary();const node=document.querySelector('#searchProtocols');node?.focus();node?.setSelectionRange(cursor,cursor)}if(e.target.id==='answerPct'){const v=e.target.value;if(v===''||(/^(100|\d{1,2})$/.test(v)&&Number(v)>=0))mutateAnswer('pct',v===''?null:Number(v))}if(e.target.id==='answerText')mutateAnswer('text',e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='answerPct'){const v=e.target.value;if(v!==''&&!(/^(100|\d{1,2})$/.test(v)&&Number(v)>=0)){const ss=session(),q=ss&&applicable(ss)[ui.step];e.target.value=q?.id&&ss.answers[q.id]?.pct!==undefined?String(ss.answers[q.id].pct):'';toast('Informe um percentual inteiro entre 0 e 100.');}}if(['qparent','qwhen'].includes(e.target.id))conditionVisibility();if(e.target.id==='qcat'){const old=document.querySelector('#qparent')?.value;const pr=protocol();const target=e.target.value;const q=pr.questions.find(z=>z.id===ui.editQuestionId);const parent=document.querySelector('#qparent');parent.innerHTML=`<option value="">Início desta categoria (pergunta principal)</option>`+pr.questions.filter(z=>z.id!==q?.id&&z.catId===target&&!isDescendant(pr,z.id,q?.id)).map(z=>`<option value="${z.id}">${safe(z.code)} · ${safe(z.text.slice(0,80))}</option>`).join('');if([...parent.options].some(o=>o.value===old))parent.value=old;conditionVisibility()}if(e.target.id==='template'){const m=db.templates.find(t=>t.id===e.target.value);if(m){document.querySelector('#tname').value=m.name;document.querySelector('#ttech').value=m.technique;document.querySelector('#tdesc').value=m.description}}if(e.target.id==='importFile'){const f=e.target.files?.[0];if(!f)return;f.text().then(t=>{const x=JSON.parse(t);if(x.schema!==1||!Array.isArray(x.data?.protocols)||!Array.isArray(x.data?.sessions)||!Array.isArray(x.data?.templates))throw new Error('Formato incompatível.');if(!confirm('Substituir os dados deste protótipo pelos dados importados?'))return;db=x.data;persist();go('home');toast('Backup importado.');}).catch(()=>toast('Arquivo inválido ou incompatível.'))}});
document.addEventListener('submit',e=>{const form=e.target;if(!['protocolForm','categoryForm','questionForm','treatmentForm'].includes(form.id))return;e.preventDefault();const fd=new FormData(form);if(form.id==='protocolForm'){const p={id:id(),name:String(fd.get('name')).trim(),description:String(fd.get('description')).trim(),category:String(fd.get('category')).trim()||'Pessoal',icon:'✺',categories:[],questions:[],published:false,version:0,created:now(),updated:now()};db.protocols.unshift(p);persist();ui.protocolId=p.id;ui.editorTab='cards';go('editor');return toast('Protocolo criado. Adicione a primeira categoria.')}if(form.id==='categoryForm'){const p=protocol();p.categories.push({id:id(),name:String(fd.get('name')).trim()});p.updated=now();p.dirty=true;persist();return go('editor')}if(form.id==='questionForm'){const p=protocol(),txt=String(fd.get('text')).trim(),parentId=String(fd.get('parentId')||''),type=String(fd.get('type')),when=parentId?String(fd.get('when')):'always',threshold=Number(fd.get('threshold')||0);const par=p.questions.find(z=>z.id===parentId);if(parentId&&!par)return toast('Pergunta anterior não encontrada.');if(parentId&&par.catId!==fd.get('catId'))return toast('A pergunta anterior precisa estar na mesma categoria.');if(parentId&&['yes','no'].includes(when)&&!['yn','both'].includes(par.type))return toast('A pergunta anterior não possui resposta Sim/Não.');if(parentId&&['gte','lt'].includes(when)&&!['pct','both'].includes(par.type))return toast('A pergunta anterior não possui percentual.');if(threshold<0||threshold>100)return toast('Use um limite entre 0 e 100%.');const prev=p.questions.find(z=>z.id===ui.editQuestionId);const before=prev?clone(prev):null;const q={id:prev?.id||id(),catId:String(fd.get('catId')),parentId,text:txt,type,when,threshold,code:prev?.code||''};if(prev)Object.assign(prev,q);else p.questions.push(q);const err=validate(p);if(err){if(prev)Object.assign(prev,before);else p.questions=p.questions.filter(x=>x.id!==q.id);return toast(err)}reCodes(p);p.updated=now();p.dirty=true;persist();ui.editQuestionId=null;ui.prefillParent='';ui.prefillCat='';go('editor');return toast('Pergunta salva.')}if(form.id==='treatmentForm'){const s=session(ui.treatSession);const t={id:id(),name:String(fd.get('name')).trim(),technique:String(fd.get('technique')).trim(),description:String(fd.get('description')).trim(),date:String(fd.get('date')),review:String(fd.get('review'))};s.treatments.push(t);s.updated=now();if(document.querySelector('#saveTemplate').checked)db.templates.push({...t,id:id()});persist();ui.reportSession=s.id;go('report');return toast('Tratamento registrado.')}});
render();
})();
